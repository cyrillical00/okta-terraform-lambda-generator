name: keepalive

# Weekly read-only ping of the Okta and GCP credentials behind live
# env-context. Okta revokes SSWS API tokens after 30 days without use, so a
# weekly run gives four chances per window. GCP keys don't idle out; that leg
# is a canary for a deleted, disabled, or de-permissioned key. See the
# keepalive.py docstring for details.
#
# Required repo secrets (Settings > Secrets and variables > Actions), same
# values as Streamlit Cloud:
#   OKTA_ORG_URL, OKTA_API_TOKEN, GCP_PROJECT_ID, GCP_SA_JSON
# When you rotate either credential, update it in both places.
#
# Triggers are schedule + manual only, so secrets never reach fork PRs.
# GitHub emails failures of scheduled runs to whoever last edited the cron
# line below.

on:
  schedule:
    - cron: "17 15 * * 1"  # Mondays 15:17 UTC, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: okta + gcp
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write  # for the re-arm step
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requests + google-auth at lockfile versions
        # -c pins every transitive dep to requirements.txt without
        # installing the whole app (streamlit, boto3, snowflake, ...).
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.txt requests google-auth
      - name: Ping Okta and GCP
        env:
          OKTA_ORG_URL: ${{ secrets.OKTA_ORG_URL }}
          OKTA_API_TOKEN: ${{ secrets.OKTA_API_TOKEN }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: python keepalive.py
      - name: Keep this schedule armed
        # Public repos lose scheduled workflows after 60 days with no repo
        # activity. Hitting the enable endpoint each run resets that clock
        # without dummy commits (same approach as the API mode of
        # gautamkrishnar/keepalive-workflow). Raw API on purpose: `gh
        # workflow enable` only resolves already-disabled workflows.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/keepalive.yml/enable"
