name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run pytest
        # tests/test_gcp_client.py has a known fake-google-modules
        # harness mismatch (6 failing tests, pre-existing on master,
        # tracked in project memory). Excluded until the harness is
        # rebuilt against the current google-cloud-iam wheel. Once
        # those are fixed, drop the --ignore flag.
        run: pytest -q --ignore=tests/test_gcp_client.py

  # qa_runner replay is intentionally NOT run in CI because
  # qa_outputs_cache.json is gitignored (it's a 1MB+ artifact of a
  # local live run). The static-QA + terraform-validate sweep is run
  # manually before pushing significant prompt changes:
  #   python qa_runner.py --terraform-validate
  # Validate baseline as of 2026-05-04: 123/133 Both. See
  # project_terraform_validate_findings memory for the open cases.

  # Phase 17a Tier 1 security automation, added 2026-05-16.
  # Three sibling jobs: dependency vuln scan, secret scan, SAST.
  # Every action reference is pinned to a commit SHA per the
  # secwatcher policy set by 4834f16. Floating tags are banned.

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Audit declared deps for known vulnerabilities
        # --strict makes any known vuln in requirements.txt fail the
        # job. Use pypa/gh-action-pip-audit if a runner-cached action
        # is preferred, but the plain CLI invocation keeps the SHA
        # surface smaller and is equivalent in scope.
        run: pip-audit -r requirements.txt --strict

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Full history on push, shallow on PRs. The action picks the
          # right scan mode automatically from github.event_name.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@458d36d7d4f47d0dd16ca424c1d3cda0060f1360  # v3.35.5
        with:
          languages: python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2

  # Phase 18a lockfile gate, added 2026-05-16. requirements.in is the
  # human-edited source of truth; requirements.txt is the pinned
  # pip-compile output. This job regenerates the lockfile against the
  # committed requirements.in and fails if the result differs from the
  # checked-in requirements.txt, so PRs that bump a dep without
  # re-running pip-compile cannot merge. pip-tools 7.x has no native
  # --check; the canonical CI idiom is regenerate-to-temp + diff.
  lock-check:
    name: lock-check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools
      - name: Verify requirements.txt is in sync with requirements.in
        run: |
          cp requirements.txt requirements.txt.committed
          pip-compile --quiet --strip-extras -o requirements.txt requirements.in
          diff requirements.txt.committed requirements.txt
