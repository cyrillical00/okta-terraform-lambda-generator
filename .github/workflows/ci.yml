name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run pytest
        # tests/test_gcp_client.py has a known fake-google-modules
        # harness mismatch (6 failing tests, pre-existing on master,
        # tracked in project memory). Excluded until the harness is
        # rebuilt against the current google-cloud-iam wheel. Once
        # those are fixed, drop the --ignore flag.
        run: pytest -q --ignore=tests/test_gcp_client.py

  # qa_runner replay is intentionally NOT run in CI because
  # qa_outputs_cache.json is gitignored (it's a 1MB+ artifact of a
  # local live run). The static-QA + terraform-validate sweep is run
  # manually before pushing significant prompt changes:
  #   python qa_runner.py --terraform-validate
  # Validate baseline as of 2026-05-04: 123/133 Both. See
  # project_terraform_validate_findings memory for the open cases.
