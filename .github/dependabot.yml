# Dependabot config for TF Tool, Phase 17a Tier 1 security automation.
# Weekly PRs for pip and github-actions ecosystems. Minor + patch
# updates grouped to keep noise low; majors land as individual PRs.
# Labels are applied so reviewers can filter the dependencies queue.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
