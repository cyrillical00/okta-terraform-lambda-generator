[theme]
# Phase 9 dark-terminal palette. The full visual stack (IBM Plex Mono,
# component overrides, motion) lives in ui/css.py via @import + custom
# selectors so we don't depend on Streamlit theme keys that vary by
# version. These four palette keys + base + font are the universally
# accepted set on Streamlit 1.56.
base = "dark"
primaryColor = "#4FC3F7"
backgroundColor = "#0A0E14"
secondaryBackgroundColor = "#11161D"
textColor = "#E6EDF3"
font = "monospace"

[server]
headless = true
