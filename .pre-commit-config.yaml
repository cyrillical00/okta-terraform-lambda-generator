# Pre-commit config for TF Tool, Phase 17a Tier 1 security automation.
# Catches secrets and private keys before they reach GitHub. Install
# once per clone with `pre-commit install`. Repo revs are pinned to
# commit SHAs per the secwatcher policy; do not regress to tags.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: detect-private-key
